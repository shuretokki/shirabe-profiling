[project]
name = "shirabe-profiling"
version = "0.2.0"
description = "High-performance Polars data profiling with web reports and quality warnings."
dynamic = ["readme"]
requires-python = ">=3.10"
license = "Apache-2.0 AND OFL-1.1-RFN AND OFL-1.1-no-RFN AND ISC AND MIT"
license-files = ["LICENSE", "LICENSES/*", "REUSE.toml"]
authors = [{ name = "shuretokki" }]
keywords = [
    "polars",
    "profiling",
    "eda",
    "data-quality",
    "data-profiling",
    "exploratory-data-analysis",
    "pandas-profiling",
    "ydata-profiling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "polars>=1.0",
    "numpy>=1.22.4",
    "jinja2>=3.1",
    "polars-statistics>=0.4",
    "scipy>=1.12",
    "phik>=0.12",
]

[project.optional-dependencies]
pandas = ["pandas", "polars[pyarrow]"]

[project.urls]
Homepage = "https://github.com/shuretokki/shirabe-profiling"
Repository = "https://github.com/shuretokki/shirabe-profiling"
Changelog = "https://github.com/shuretokki/shirabe-profiling/blob/main/CHANGELOG.md"
Issues = "https://github.com/shuretokki/shirabe-profiling/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.40",
    "dekit-cli>=0.10.2",
    "packaging>=26.0",
    "pillow>=12.3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "readme-renderer[md]>=46.0",
    "ruff>=0.8",
    "trove-classifiers>=2026.9.21.13",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=25.1,<26"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset|href)="((?:docs|assets)/[^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/shuretokki/shirabe-profiling/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(LICENSE)"'
replacement = 'href="https://github.com/shuretokki/shirabe-profiling/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\[([^\]]+)\]\(((?!https?://|#)[^)\s]+)\)'
replacement = '[\1](https://github.com/shuretokki/shirabe-profiling/tree/main/\g<2>)'

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/assets/screenshots/*.mp4", "/assets/screenshots/*.webm"]

[tool.hatch.build.targets.wheel]
packages = ["src/shirabe_profiling"]
[tool.hatch.build.targets.wheel.force-include]
"src/shirabe_profiling/py.typed" = "shirabe_profiling/py.typed"

[tool.basedpyright]
include = ["src", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportPrivateUsage = "error"
reportUnnecessaryComparison = "error"
reportUnusedFunction = "error"

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "ARG", "T201", "COM812"]

[tool.ruff.lint.isort]
known-first-party = ["shirabe_profiling"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"benchmarks/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
