name: docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the docs
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    env:
      NUXT_APP_BASE_URL: /shirabe-profiling/
      NUXT_SITE_URL: https://shuretokki.github.io
      NITRO_PRESET: github_pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: kind
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ((a|b|rc)[0-9]+|\.dev[0-9]+)$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
        with:
          just-version: "1.58.0"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: lychee@0.24.2
      - run: npm install
        working-directory: docs
      - run: just docs-build
      - name: Check the links in the layout that Pages serves
        run: |
          mkdir site
          cp -r docs/.output/public site/shirabe-profiling
          lychee --offline --include-fragments=anchor-only --root-dir "$PWD/site" --no-progress --format compact 'site/**/*.html'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.output/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
